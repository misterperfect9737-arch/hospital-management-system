{% extends "base.html" %}
{% block title %}Edit Doctor{% endblock %}
{% block content %}
<div class="container">
    <div class="dashboard-header">
        <h1 class="dashboard-title"><i class="fas fa-edit"></i> Edit Doctor</h1>
    </div>
    <div class="card">
        <div class="card-body">
            <form method="POST" class="needs-validation" novalidate>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" class="form-control" name="full_name" value="{{ doctor.user.full_name }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control" name="email" value="{{ doctor.user.email }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-control" name="phone" value="{{ doctor.user.phone or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Department *</label>
                        <select class="form-select" name="department_id" required>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}" {% if dept.id == doctor.department_id %}selected{% endif %}>{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Specialization *</label>
                        <input type="text" class="form-control" name="specialization" value="{{ doctor.specialization }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Qualification</label>
                        <input type="text" class="form-control" name="qualification" value="{{ doctor.qualification or '' }}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Experience (Years)</label>
                        <input type="number" class="form-control" name="experience_years" value="{{ doctor.experience_years or 0 }}" min="0">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Consultation Fee</label>
                        <input type="number" class="form-control" name="consultation_fee" value="{{ doctor.consultation_fee or 0 }}" step="0.01" min="0">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Bio</label>
                    <textarea class="form-control" name="bio" rows="3">{{ doctor.bio or '' }}</textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update</button>
                    <a href="{{ url_for('admin_doctors') }}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
